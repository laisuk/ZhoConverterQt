name: Linux Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: 6.11.2
      QT_ROOT: ${{ github.workspace }}/Qt
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-image0 \
            libxcb-render-util0

      - name: Install Qt 6.11.2
        run: |
          python3 -m pip install --user aqtinstall

          python3 -m aqt install-qt \
            -O "$QT_ROOT" \
            linux desktop \
            "$QT_VERSION" \
            linux_gcc_64

          echo "$QT_ROOT/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install vcpkg dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            zlib:x64-linux \
            libzip:x64-linux \
            minizip-ng:x64-linux      

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Patch minizip-ng header
        run: |
          MZ_HEADER="$VCPKG_ROOT/installed/x64-linux/include/minizip-ng/mz_zip_rw.h"
      
          sed -i '/#include "mz_strm.h"/a #include <cstdint>\n#include <mz_zip.h>' "$MZ_HEADER"
      
          head -n 20 "$MZ_HEADER"

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Collect artifact
        run: |
          mkdir -p artifact

          cp build/ZhoConverterQt artifact/
          cp opencc-fmmseg/libopencc_fmmseg_capi.so artifact/
          cp pdfium/libpdfium.so artifact/

          chmod +x artifact/ZhoConverterQt

          tar -C artifact \
            -czf ZhoConverterQt-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZhoConverterQt-linux-x64
          path: ZhoConverterQt-linux-x64.tar.gz