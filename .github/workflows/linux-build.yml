name: Linux Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: 6.11.2
      QT_ROOT: ${{ github.workspace }}/Qt

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev

      - name: Install Qt 6.11.2
        run: |
          python3 -m pip install --user aqtinstall

          python3 -m aqt install-qt \
            -O "$QT_ROOT" \
            linux desktop \
            "$QT_VERSION" \
            linux_gcc_64

          echo "$QT_ROOT/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Collect artifact
        run: |
          mkdir -p artifact

          cp build/ZhoConverterQt artifact/
          cp opencc-fmmseg/libopencc_fmmseg_capi.so artifact/
          cp pdfium/libpdfium.so artifact/

          chmod +x artifact/ZhoConverterQt

          tar -C artifact \
            -czf ZhoConverterQt-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZhoConverterQt-linux-x64
          path: ZhoConverterQt-linux-x64.tar.gz