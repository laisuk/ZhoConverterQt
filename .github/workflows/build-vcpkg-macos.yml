name: Build vcpkg macOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git _vcpkg
          ./_vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Create ARM64 static triplet
        run: |
          cat > _vcpkg/triplets/community/arm64-osx-static.cmake <<'EOF'
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CMAKE_SYSTEM_NAME Darwin)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          EOF

      - name: Install dependencies
        run: |
          ./_vcpkg/vcpkg install \
            "libzip[bzip2]:arm64-osx-static" \
            "minizip-ng[core,zlib]:arm64-osx-static"

      - name: Show installed files
        run: |
          find _vcpkg/installed/arm64-osx-static -type f | sort

      - name: Replace minizip-ng header
        run: |
          MZ_HEADER="_vcpkg/installed/arm64-osx-static/include/minizip-ng/mz_zip_rw.h"
      
          cp -f minizip-reduced/mz_zip_rw.h "$MZ_HEADER"
          cmp minizip-reduced/mz_zip_rw.h "$MZ_HEADER"

      - name: Prepare artifact
        run: |
          SRC="_vcpkg"
          DEST="artifact/macos-arm64"

          mkdir -p "$DEST/installed"
          mkdir -p "$DEST/scripts/buildsystems/msbuild"
          mkdir -p "$DEST/scripts/buildsystems/osx"
          mkdir -p "$DEST/scripts/cmake"

          # Root marker
          cp -f "$SRC/.vcpkg-root" \
            "$DEST/.vcpkg-root"

          # Keep installed triplet unchanged.
          cp -R "$SRC/installed/arm64-osx-static" \
            "$DEST/installed/"

          # Minimal vcpkg toolchain infrastructure, matching existing vendor roots.
          cp -f "$SRC/scripts/buildsystems/vcpkg.cmake" \
            "$DEST/scripts/buildsystems/"

          cp -f "$SRC/scripts/buildsystems/msbuild/applocal.ps1" \
                "$SRC/scripts/buildsystems/msbuild/vcpkg.props" \
                "$SRC/scripts/buildsystems/msbuild/vcpkg.targets" \
                "$SRC/scripts/buildsystems/msbuild/vcpkg-general.xml" \
            "$DEST/scripts/buildsystems/msbuild/"

          cp -f "$SRC/scripts/buildsystems/osx/applocal.py" \
            "$DEST/scripts/buildsystems/osx/"

          cp -f "$SRC/scripts/cmake/vcpkg_get_windows_sdk.cmake" \
            "$DEST/scripts/cmake/"

      - name: Verify artifact
        run: |
          DEST="artifact/macos-arm64"

          test -f "$DEST/.vcpkg-root"
          test -d "$DEST/installed/arm64-osx-static"

          test -f "$DEST/scripts/buildsystems/vcpkg.cmake"
          test -f "$DEST/scripts/buildsystems/msbuild/applocal.ps1"
          test -f "$DEST/scripts/buildsystems/msbuild/vcpkg.props"
          test -f "$DEST/scripts/buildsystems/msbuild/vcpkg.targets"
          test -f "$DEST/scripts/buildsystems/msbuild/vcpkg-general.xml"
          test -f "$DEST/scripts/buildsystems/osx/applocal.py"
          test -f "$DEST/scripts/cmake/vcpkg_get_windows_sdk.cmake"

          find "$DEST" -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-macos-arm64
          path: artifact/macos-arm64
          if-no-files-found: error
          include-hidden-files: true