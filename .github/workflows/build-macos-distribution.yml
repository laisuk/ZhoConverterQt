name: macOS ARM64 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt 6.11.2
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          source "$RUNNER_TEMP/aqt-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/miurahr/aqtinstall.git@9e49c82edc6d946db376dec907cca5b4b486eec5"

          aqt install-qt \
            -O "$HOME/Qt" \
            mac desktop \
            6.11.2 \
            clang_64

          echo "$RUNNER_TEMP/aqt-venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.11.2/macos/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/6.11.2/macos" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Install
        run: |
          cmake --install build
          echo "=== install tree ==="
          find build/install -maxdepth 4 -print

      - name: Deploy Qt
        run: |
          macdeployqt \
            build/install/ZhoConverterQt.app \
            -always-overwrite \
            -verbose=2

      - name: Fix native library paths
        run: |
          APP="build/install/ZhoConverterQt.app"
          EXE="$APP/Contents/MacOS/ZhoConverterQt"
      
          OPENCC_PATH="$(otool -L "$EXE" | awk '/libopencc_fmmseg_capi\.dylib/ {print $1}')"
          PDFIUM_PATH="$(otool -L "$EXE" | awk '/libpdfium\.dylib/ {print $1}')"
      
          install_name_tool -change \
            "$OPENCC_PATH" \
            "@rpath/libopencc_fmmseg_capi.dylib" \
            "$EXE"
      
          install_name_tool -change \
            "$PDFIUM_PATH" \
            "@rpath/libpdfium.dylib" \
            "$EXE"

      - name: Verify bundle
        run: |
          test -d build/install/ZhoConverterQt.app
          test -x build/install/ZhoConverterQt.app/Contents/MacOS/ZhoConverterQt

          file build/install/ZhoConverterQt.app/Contents/MacOS/ZhoConverterQt

          otool -l build/install/ZhoConverterQt.app/Contents/MacOS/ZhoConverterQt |
            grep -A2 LC_RPATH
          
          otool -L build/install/ZhoConverterQt.app/Contents/MacOS/ZhoConverterQt

      - name: Create ZIP
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            build/install/ZhoConverterQt.app \
            ZhoConverterQt-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZhoConverterQt-macos-arm64
          path: ZhoConverterQt-macos-arm64.zip