name: macOS ARM64 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt 6.11.2
        run: |
          python3 -m pip install \
            "git+https://github.com/miurahr/aqtinstall.git@9e49c82edc6d946db376dec907cca5b4b486eec5"

          aqt install-qt \
            -O "$HOME/Qt" \
            mac desktop \
            6.11.2 \
            clang_64

          echo "$HOME/Qt/6.11.2/macos/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/6.11.2/macos" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Install
        run: |
          cmake --install build

      - name: Deploy Qt
        run: |
          macdeployqt \
            build/install/ZhoConverterQt.app \
            -always-overwrite \
            -verbose=2

      - name: Verify bundle
        run: |
          test -d build/install/ZhoConverterQt.app
          test -x build/install/ZhoConverterQt.app/Contents/MacOS/ZhoConverterQt

          file build/install/ZhoConverterQt.app/Contents/MacOS/ZhoConverterQt

          otool -L \
            build/install/ZhoConverterQt.app/Contents/MacOS/ZhoConverterQt

      - name: Create ZIP
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            build/install/ZhoConverterQt.app \
            ZhoConverterQt-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZhoConverterQt-macos-arm64
          path: ZhoConverterQt-macos-arm64.zip