name: ZhoConverterQt Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: 6.11.2
      QT_ROOT: ${{ github.workspace }}/Qt

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-image0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-util1 \
            libxcb-xkb1

      - name: Install Qt 6.11.2
        run: |
          python3 -m pip install --user aqtinstall

          python3 -m aqt install-qt \
            -O "$QT_ROOT" \
            linux desktop \
            "$QT_VERSION" \
            linux_gcc_64

          echo "$QT_ROOT/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Create AppDir
        run: |
          APPDIR="$RUNNER_TEMP/AppDir"

          mkdir -p "$APPDIR/usr/bin"

          cp build/ZhoConverterQt "$APPDIR/usr/bin/"
          cp opencc-fmmseg/libopencc_fmmseg_capi.so "$APPDIR/usr/bin/"
          cp pdfium/libpdfium.so "$APPDIR/usr/bin/"

          chmod +x "$APPDIR/usr/bin/ZhoConverterQt"

      - name: Download linuxdeploy
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Deploy Qt runtime
        env:
          QMAKE: ${{ env.QT_ROOT }}/${{ env.QT_VERSION }}/gcc_64/bin/qmake
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export LD_LIBRARY_PATH="$QT_ROOT/$QT_VERSION/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          ./linuxdeploy-x86_64.AppImage \
            --appdir "$RUNNER_TEMP/AppDir" \
            --executable "$RUNNER_TEMP/AppDir/usr/bin/ZhoConverterQt" \
            --plugin qt

          echo "=== Deployed AppDir ==="
          find "$RUNNER_TEMP/AppDir" -type f | sort

      - name: Verify deployed binary
        run: |
          echo "=== ZhoConverterQt dependencies ==="
          ldd "$RUNNER_TEMP/AppDir/usr/bin/ZhoConverterQt"

          echo "=== Bundled Qt libraries ==="
          find "$RUNNER_TEMP/AppDir" -name 'libQt6*.so*' -print

          echo "=== Qt platform plugins ==="
          find "$RUNNER_TEMP/AppDir" -path '*platforms*' -type f -print

      - name: Create artifact
        run: |
          tar -C "$RUNNER_TEMP/AppDir" \
            -czf ZhoConverterQt-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZhoConverterQt-linux-x64
          path: ZhoConverterQt-linux-x64.tar.gz

  macos:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt 6.11.2
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          source "$RUNNER_TEMP/aqt-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/miurahr/aqtinstall.git@9e49c82edc6d946db376dec907cca5b4b486eec5"

          aqt install-qt \
            -O "$HOME/Qt" \
            mac desktop \
            6.11.2 \
            clang_64

          echo "$RUNNER_TEMP/aqt-venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.11.2/macos/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/6.11.2/macos" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Install
        run: |
          cmake --install build
          echo "=== install tree ==="
          find build/install -maxdepth 4 -print

      - name: Deploy Qt
        run: |
          macdeployqt \
            build/install/ZhoConverterQt.app \
            -always-overwrite \
            -verbose=2

      - name: Sign and verify bundle
        run: |
          APP="build/install/ZhoConverterQt.app"
          EXE="$APP/Contents/MacOS/ZhoConverterQt"
          test -x "$EXE"
          for LIB in libopencc_fmmseg_capi.dylib libpdfium.dylib; do
            test -f "$APP/Contents/Frameworks/$LIB"
            otool -L "$EXE" | awk '{print $1}' | grep -Fx "@rpath/$LIB"
            otool -D "$APP/Contents/Frameworks/$LIB" | grep -Fx "@rpath/$LIB"
          done
          otool -l "$EXE" | grep -F '@executable_path/../Frameworks'
          lipo -verify_arch arm64 "$EXE"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Smoke test relocated bundle
        run: |
          ditto build/install/ZhoConverterQt.app "$RUNNER_TEMP/ZhoConverterQt.app"
          QT_QPA_PLATFORM=offscreen python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          exe = Path(os.environ['RUNNER_TEMP']) / 'ZhoConverterQt.app/Contents/MacOS/ZhoConverterQt'
          with (Path(os.environ['RUNNER_TEMP']) / 'zho-startup.log').open('w+') as log:
              process = subprocess.Popen([str(exe)], cwd=os.environ['RUNNER_TEMP'], stdout=log, stderr=log)
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
              else:
                  log.seek(0)
                  raise SystemExit(f'Application exited during startup ({process.returncode}):\n{log.read()}')
          PY

      - name: Create ZIP
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            build/install/ZhoConverterQt.app \
            ZhoConverterQt-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZhoConverterQt-macos-arm64
          path: ZhoConverterQt-macos-arm64.zip

  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.11.2
        shell: pwsh
        run: |
          python -m pip install `
            "git+https://github.com/miurahr/aqtinstall.git@9e49c82edc6d946db376dec907cca5b4b486eec5"

          aqt install-qt `
            -O C:\Qt `
            windows desktop `
            6.11.2 `
            win64_msvc2022_64

          "C:\Qt\6.11.2\msvc2022_64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          "CMAKE_PREFIX_PATH=C:\Qt\6.11.2\msvc2022_64" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DZHO_USE_BUNDLED_MINGW=OFF `
            -DDEPLOY_WITH_WINDEPLOYQT=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel

      - name: Install and deploy
        shell: pwsh
        run: |
          cmake --install build

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/install/bin/* `
            -DestinationPath ZhoConverterQt-win-x64-msvc.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZhoConverterQt-win-x64-msvc
          path: ZhoConverterQt-win-x64-msvc.zip

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ZhoConverterQt-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/ZhoConverterQt-*.zip dist/ZhoConverterQt-*.tar.gz)
          if (( ${#files[@]} != 3 )); then
            echo "Expected 3 distribution archives; found ${#files[@]}" >&2
            exit 1
          fi
          args=()
          if [[ "$TAG" =~ -beta[0-9]+$ ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$TAG" "${files[@]}" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            "${args[@]}"
